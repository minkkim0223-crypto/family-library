<script>
/* ---------- shared constants ---------- */
var MEMBER_COLORS=['#4C6B8A','#8A5646','#5C7A45','#8A5A93','#3E8A79','#B8874A','#6B5B8F','#A8542E'];
var STATUS_COLOR={
  active:'#1F3D34', soon:'#B9821F', overdue:'#A83A32', returned:'#8B8576',
  wait:'#4C6B8A', arrived:'#4E7351', canceled:'#8B8576'
};
var TRANSFER_STATUS_COLOR={ requested:'#4C6B8A', moving:'#B9821F', arrived:'#4E7351', received:'#8B8576' };

var DEFAULT_STATE = {
  members:[
    {id:'m1',name:'가족원1',color:MEMBER_COLORS[0]},
    {id:'m2',name:'가족원2',color:MEMBER_COLORS[1]},
    {id:'m3',name:'가족원3',color:MEMBER_COLORS[2]}
  ],
  libraries:[], loans:[], reservations:[], transfers:[]
};

/* ---------- date utils ---------- */
function uid(p){ return p+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function pad(n){ return n<10?'0'+n:''+n; }
function todayStr(){ var d=new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function addDaysStr(dateStr,n){
  var d=new Date(dateStr+'T00:00:00'); d.setDate(d.getDate()+n);
  return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
}
function diffDays(dateStr){
  var t=new Date(todayStr()+'T00:00:00'), d=new Date(dateStr+'T00:00:00');
  return Math.round((d-t)/86400000);
}
function fmtDate(s){ if(!s) return '-'; var p=s.split('-'); return p[0]+'.'+p[1]+'.'+p[2]; }

/* ---------- status / label helpers ---------- */
function loanStatus(loan){
  if(loan.returnDate) return 'returned';
  var d=diffDays(loan.dueDate);
  if(d<0) return 'overdue';
  if(d<=3) return 'soon';
  return 'active';
}
function loanStampText(loan){
  var st=loanStatus(loan);
  if(st==='returned') return '반납완료';
  var d=diffDays(loan.dueDate);
  if(st==='overdue') return '연체 D+'+Math.abs(d);
  if(d===0) return '오늘마감';
  return 'D-'+d;
}
function tagLabel(tag){ if(!tag) return ''; if(tag==='반납연기') return '연장됨'; return tag; }
function tagColor(tag){ if(tag==='책나르샤') return STATUS_COLOR.wait; if(tag==='반납연기') return STATUS_COLOR.soon; return STATUS_COLOR.wait; }
function inferCategory(room){
  if(!room) return 'adult';
  if(room.indexOf('어린이')>=0 || room.indexOf('아동')>=0 || room.indexOf('유아')>=0) return 'kids';
  return 'adult';
}
function categoryLabel(cat){ return cat==='kids'?'비아책':'민경책'; }
function categoryColor(cat){ return cat==='kids'?STATUS_COLOR.soon:STATUS_COLOR.wait; }
function statusKeyTransfer(status){
  if((status||'').indexOf('대출중')===0) return 'arrived';
  if(status==='대출대기중') return 'requested';
  return 'requested';
}
function getMember(members,id){
  var m=members.filter(function(x){return x.id===id;})[0];
  return m || {id:id,name:'탈퇴한 가족원',color:'#8B8576'};
}

/* ---------- paste parsers (identical logic to standalone version) ---------- */
function flattenPaste(raw){
  return raw.replace(/\r/g,'\n').split('\n').map(function(s){return s.trim();})
    .filter(function(s){return s.length>0;})
    .map(function(l){return l.replace(/^\*+\s*/,'');}).join('');
}
function extractLoanLibTitle(beforeLoan){
  var bracketMatch=beforeLoan.match(/\[(.+?)\]([\s\S]*)$/);
  var libshort='',room='',title='';
  if(bracketMatch){
    libshort=bracketMatch[1]; room=bracketMatch[2].trim();
    var titleAndLib=beforeLoan.slice(0,beforeLoan.indexOf('['));
    title=titleAndLib;
    if(title.length>=libshort.length && title.slice(title.length-libshort.length)===libshort){
      title=title.slice(0,title.length-libshort.length);
    }
  }else{
    var smallIdx=beforeLoan.indexOf('작은도서관');
    if(smallIdx>=0){
      room='작은도서관';
      var beforeSmall=beforeLoan.slice(0,smallIdx).replace(/\s+$/,'');
      var found=null;
      for(var L=1;L<=Math.floor(beforeSmall.length/2) && L<=12;L++){
        var tail=beforeSmall.slice(-L), prev=beforeSmall.slice(-2*L,-L);
        if(tail===prev && tail.length>0) found=tail;
      }
      if(found){ libshort=found; title=beforeSmall.slice(0,beforeSmall.length-2*found.length); }
      else{ title=beforeSmall; libshort=''; }
    }else{
      title=beforeLoan; libshort=''; room='';
    }
  }
  title=title.replace(/\s+/g,' ').trim();
  return {title:title,library:libshort,room:room};
}
function parseLoanPasteText(raw){
  var flat=flattenPaste(raw);
  var parts=flat.split('등록번호');
  var records=[]; var failed=0;
  for(var i=1;i<parts.length;i++){
    var seg=parts[i];
    var m=seg.match(/^([A-Z0-9]+?)(?=[^A-Z0-9])/);
    if(!m) continue;
    var regno=m[1];
    var rest=seg.slice(regno.length);
    var loanIdx=rest.indexOf('대출일');
    if(loanIdx<0){ failed++; continue; }
    var beforeLoan=rest.slice(0,loanIdx);
    var afterLoanLabel=rest.slice(loanIdx+3);
    var dm1=afterLoanLabel.match(/^(\d{4}\/\d{2}\/\d{2})/);
    if(!dm1){ failed++; continue; }
    var borrowDate=dm1[1].replace(/\//g,'-');
    var afterBorrow=afterLoanLabel.slice(dm1[1].length);
    var dueIdx=afterBorrow.indexOf('반납예정일');
    if(dueIdx<0){ failed++; continue; }
    var afterDueLabel=afterBorrow.slice(dueIdx+5);
    var dm2=afterDueLabel.match(/^(\d{4}\/\d{2}\/\d{2})/);
    if(!dm2){ failed++; continue; }
    var dueDate=dm2[1].replace(/\//g,'-');
    var status=afterDueLabel.slice(dm2[1].length).replace(/\d+$/,'').trim();
    var lt=extractLoanLibTitle(beforeLoan);
    if(lt.title){
      records.push({regno:regno,title:lt.title,library:lt.library,room:lt.room,borrowDate:borrowDate,dueDate:dueDate,tag:(status==='대출'?'':status)});
    }else{ failed++; }
  }
  return {records:records,failed:failed};
}
function parseReservationPasteText(raw){
  var flat=flattenPaste(raw);
  var parts=flat.split('취소');
  var records=[]; var failed=0;
  for(var i=0;i<parts.length-1;i++){
    var seg=parts[i];
    var m1=seg.match(/^([\s\S]*?)신청일(\d{4}\/\d{2}\/\d{2})([\s\S]*)$/);
    if(!m1) continue;
    var title=m1[1].replace(/^\d+/,'').replace(/\s+/g,' ').trim();
    var reserveDate=m1[2].replace(/\//g,'-');
    var rest=m1[3];
    var dueIdx=rest.indexOf('반납예정일');
    if(dueIdx<0){ failed++; continue; }
    var after=rest.slice(dueIdx+5);
    var ready=false, pickupDeadline='';
    if(after.slice(0,3)==='만기일'){
      ready=true;
      var afterLabel=after.slice(3);
      var dm=afterLabel.match(/(\d{4}\/\d{2}\/\d{2})/);
      if(dm){ pickupDeadline=dm[1].replace(/\//g,'-'); after=afterLabel.slice(afterLabel.indexOf(dm[1])+dm[1].length); }
      else{ after=afterLabel; }
    }else{
      var dm2=after.match(/(\d{4}\/\d{2}\/\d{2})/);
      if(dm2){ after=after.slice(after.indexOf(dm2[1])+dm2[1].length); }
    }
    var rest3=after;
    var rankIdx=rest3.indexOf('예약순위');
    if(rankIdx<0){ failed++; continue; }
    var libRaw=rest3.slice(0,rankIdx);
    var library;
    var bracketIdx=libRaw.indexOf('[');
    if(bracketIdx>=0){
      library=libRaw.slice(0,bracketIdx).replace(/\/$/,'').trim();
      if(!library){ var bm=libRaw.match(/\[(.+?)\]/); library=bm?bm[1]:libRaw.trim(); }
    }else{
      library=(libRaw.split('/')[0]||libRaw).trim();
    }
    if(!title||!library){ failed++; continue; }
    records.push({title:title,library:library,reserveDate:reserveDate,status:ready?'도착':'대기중',pickupDeadline:pickupDeadline});
  }
  return {records:records,failed:failed};
}
function parseTransferPasteText(raw){
  var flat=flattenPaste(raw);
  var parts=flat.split('등록번호');
  var records=[]; var failed=0;
  for(var i=1;i<parts.length;i++){
    var seg=parts[i];
    var m1=seg.match(/^([A-Z0-9]+?)(?=[^A-Z0-9])/);
    if(!m1) continue;
    var regno=m1[1];
    var rest=seg.slice(regno.length);
    var reqIdx=rest.indexOf('신청일');
    if(reqIdx<0){ failed++; continue; }
    var title=rest.slice(0,reqIdx).replace(/\s+/g,' ').trim();
    var afterReq=rest.slice(reqIdx+3);
    var dm=afterReq.match(/^(\d{4}\/\d{2}\/\d{2})/);
    if(!dm){ failed++; continue; }
    var requestDate=dm[1].replace(/\//g,'-');
    var afterReqDate=afterReq.slice(dm[1].length);
    var recvIdx=afterReqDate.indexOf('수령도서관');
    if(recvIdx<0){ failed++; continue; }
    var middle=afterReqDate.slice(0,recvIdx);
    var tail=afterReqDate.slice(recvIdx+5);
    var dates=middle.match(/\d{4}\/\d{2}\/\d{2}/g)||[];
    var arrivalDate=dates[0]?dates[0].replace(/\//g,'-'):'';
    var dueDate=dates[1]?dates[1].replace(/\//g,'-'):'';
    var provIdx=tail.indexOf('제공도서관');
    if(provIdx<0){ failed++; continue; }
    var pickupLibrary=tail.slice(0,provIdx).replace(/\s+/g,' ').trim();
    var afterProv=tail.slice(provIdx+5);
    var cleaned=afterProv.replace(/\d+$/,''); // strip a leaked next-record row number, if any
    var KNOWN_TRANSFER_STATUSES=['대출중 (책나르샤)','복귀대상자료(대출불가)','대출대기중','완료','취소'];
    var sourceLibrary, status;
    var matchedStatus=null;
    for(var s=0;s<KNOWN_TRANSFER_STATUSES.length;s++){
      var cand=KNOWN_TRANSFER_STATUSES[s];
      if(cleaned.length>cand.length && cleaned.slice(-cand.length)===cand){ matchedStatus=cand; break; }
    }
    if(matchedStatus){
      sourceLibrary=cleaned.slice(0,cleaned.length-matchedStatus.length).trim();
      status=matchedStatus;
    }else{
      // unknown status text - don't guess and risk corrupting the library name; leave status blank for manual review
      sourceLibrary=cleaned.trim();
      status='';
    }
    if(title){
      records.push({regno:regno,title:title,requestDate:requestDate,arrivalDate:arrivalDate,dueDate:dueDate,
        pickupLibrary:pickupLibrary,sourceLibrary:sourceLibrary,status:status});
    }else{ failed++; }
  }
  return {records:records,failed:failed};
}

const {useState,useEffect,useRef,useMemo} = React;

/* ================= small reusable pieces ================= */

    }
  },children);
}
function Chip({active,onClick,color,children}){
  return React.createElement('div',{
    onClick:onClick,
    className:'flex items-center gap-1.5 px-3 py-1.5 rounded-full border text-sm cursor-pointer transition',

  },
    color?React.createElement('span',{className:'w-2 h-2 rounded-full flex-shrink-0',style:{background:color}}):null,
    children
  );
}
function StatCard({num,label,warn}){

    React.createElement('div',{className:'text-xs mt-1',style:{color:'#8B8576'}},label)
  );
}
function EmptyState({title,sub}){
  return React.createElement('div',{className:'text-center py-12 px-5 border border-dashed rounded-xl',style:{borderColor:'#DAD2BC',background:'#F7F4EA',color:'#8B8576'}},
    React.createElement(Stamp,{color:'#8B8576'},'기록\n없음'.split('\n').map(function(t,i){return React.createElement('div',{key:i},t);})),
    React.createElement('p',{className:'mt-3 text-sm'},React.createElement('b',null,title),React.createElement('br'),sub)
  );
}
function Badge({children,color,onClick,title}){
  return React.createElement('span',{
    onClick:onClick,title:title,
    className:'text-xs px-2.5 py-1 rounded-full border inline-flex items-center gap-1',
    style:{borderColor:color?color+'55':'#DAD2BC',color:color||'#8B8576',cursor:onClick?'pointer':'default'}
  },children);
}
function Btn({children,onClick,type,variant,small,disabled}){
  var base='inline-flex items-center gap-1.5 rounded-lg font-medium transition ';
  base += small?'text-xs px-2.5 py-1.5 rounded-md ':'text-sm px-4 py-2 ';
  var style={};
  if(variant==='primary'){ style={background:'#1F3D34',color:'#EDE8DA'}; }
  else if(variant==='brass'){ style={background:'#B8874A',color:'#2A1D0C'}; }
  else if(variant==='danger'){ style={background:'transparent',color:'#A83A32'}; }
  else { style={background:'transparent',border:'1px solid #DAD2BC',color:'#26241D'}; }
  return React.createElement('button',{type:type||'button',onClick:onClick,disabled:disabled,className:base,style:style},children);
}
function Toast({message}){
  if(!message) return null;
  return React.createElement('div',{
    className:'fixed left-1/2 bottom-6 -translate-x-1/2 px-5 py-2.5 rounded-full text-sm shadow-lg z-50',
    style:{background:'#1F3D34',color:'#EDE8DA'}
  },message);
}
function ConfirmDialog({dialog,onCancel,onConfirm}){
  if(!dialog) return null;
  return React.createElement('div',{className:'fixed inset-0 z-50 flex items-center justify-center p-4',style:{background:'rgba(19,45,37,.45)'}},
    React.createElement('div',{className:'rounded-2xl p-6 max-w-xs w-full text-center',style:{background:'#EDE8DA'}},
      React.createElement('p',{className:'text-sm mb-4'},dialog.message),
      React.createElement('div',{className:'flex gap-2 justify-center'},
        React.createElement(Btn,{onClick:onCancel},'취소'),
        React.createElement(Btn,{onClick:onConfirm,variant:'danger'},'삭제')
      )
    )
  );
}

function LoanForm({rec,members,onSave,onClose}){
  var init = rec||{};

  var [returnDate,setReturnDate]=useState(init.returnDate||'');
  var [tag,setTag]=useState(init.tag||'');
  var [category,setCategory]=useState(init.category||'adult');

    onSave({

      room: init.room||'', regno: init.regno||'', memberId:memberId, borrowDate:borrowDate, dueDate:dueDate,

      h(Field,{label:'저자 (선택)'},h(TextInput,{value:author,onChange:function(e){setAuthor(e.target.value);}})),
      h(Field,{label:'도서관'},h(TextInput,{value:library,onChange:function(e){setLibrary(e.target.value);},list:'libraryOptions',placeholder:'도서관 이름'})),
      h(Field,{label:'가족 구성원'},h(SelectInput,{value:memberId,onChange:function(e){setMemberId(e.target.value);}},
        h('option',{value:''},'선택하세요'),
        members.map(function(m){return h('option',{key:m.id,value:m.id},m.name);})
      )),
      h('div',{className:'grid grid-cols-2 gap-3'},
        h(Field,{label:'대출일'},h(TextInput,{type:'date',value:borrowDate,onChange:function(e){setBorrowDate(e.target.value);}})),
        h(Field,{label:'반납예정일'},h(TextInput,{type:'date',value:dueDate,onChange:function(e){setDueDate(e.target.value);}}))
      ),
      h(Field,{label:'반납일 (반납 시 입력)'},h(TextInput,{type:'date',value:returnDate,onChange:function(e){setReturnDate(e.target.value);}})),
      h(Field,{label:'구분'},h(SelectInput,{value:tag,onChange:function(e){setTag(e.target.value);}},
        h('option',{value:''},'일반 대출'),h('option',{value:'책나르샤'},'책나르샤'),h('option',{value:'반납연기'},'연장됨')
      )),
      h(Field,{label:'분류'},h(SelectInput,{value:category,onChange:function(e){setCategory(e.target.value);}},
        h('option',{value:'adult'},categoryLabel('adult')),h('option',{value:'kids'},categoryLabel('kids'))

/* ================= generic paste-import modal ================= */
var IMPORT_META = {
  loan: { title:'대출현황', parser:parseLoanPasteText, hint:'대출현황' },
  reservation: { title:'예약현황', parser:parseReservationPasteText, hint:'예약현황' },
  transfer: { title:'책나르샤(나르샤)', parser:parseTransferPasteText, hint:'책나르샤' }
};
function ImportModal({kind,members,onClose,onConfirm}){
  var meta = IMPORT_META[kind];
  var [memberId,setMemberId]=useState('');
  var [text,setText]=useState('');
  var [err,setErr]=useState('');
  var [parsed,setParsed]=useState(null);
  function analyze(e){
    e.preventDefault();
    if(!memberId){ setErr('먼저 가족 구성원을 선택해주세요.'); return; }
    if(!text.trim()){ setErr('붙여넣은 내용이 없어요.'); return; }
    setErr('');
    if(!parsed){
      var result = meta.parser(text);
      if(result.records.length===0){ setErr('인식할 수 있는 항목을 찾지 못했어요. 표 전체를 다시 복사해서 붙여넣어 보세요.'); return; }
      setParsed(result);
      return;
    }
    onConfirm(memberId,parsed.records);
  }
  return h(Modal,{onClose:onClose},
    h('h2',{className:'font-serif text-lg font-bold mb-4'},'도서관 사이트에서 붙여넣기'),
    err?h('div',{className:'text-sm rounded-lg px-3 py-2 mb-3.5',style:{background:'#F6E9E8',color:'#A83A32'}},err):null,
    h('p',{className:'text-xs mb-3.5',style:{color:'#8B8576'}},'bangbae.seocholib.or.kr에서 ',h('b',null,meta.hint),' 페이지 표 전체를 복사한 뒤 아래에 붙여넣으세요.'),
    h('form',{onSubmit:analyze},
      h(Field,{label:'가족 구성원'},h(SelectInput,{value:memberId,onChange:function(e){setMemberId(e.target.value);}},
        h('option',{value:''},'선택하세요'),
        members.map(function(m){return h('option',{key:m.id,value:m.id},m.name);})
      )),
      h(Field,{label:meta.title+' 붙여넣기'},
        h('textarea',{rows:8,value:text,onChange:function(e){setText(e.target.value);},
          className:'w-full px-2.5 py-2 border rounded-lg font-mono text-xs bg-white',placeholder:'여기에 붙여넣으세요'})
      ),
      parsed?h('div',{className:'rounded-lg p-3 mb-3.5 text-sm bg-white border',style:{borderColor:'#DAD2BC'}},
        h('b',null,parsed.records.length+'건'),'을 인식했어요',(parsed.failed>0?' (인식 못한 항목 '+parsed.failed+'건 제외)':''),
        h('div',{className:'flex flex-col gap-1.5 mt-2'},
          parsed.records.slice(0,6).map(function(r,i){
            return h('div',{key:i,className:'flex items-center gap-2 bg-white border rounded-lg px-2.5 py-1.5 text-xs',style:{borderColor:'#DAD2BC'}},
              h('span',{className:'flex-1 font-medium'},r.title),
              h('span',{className:'font-mono',style:{color:'#8B8576'}},r.status||(fmtDate(r.borrowDate)+' → '+fmtDate(r.dueDate)))
            );
          }),
          parsed.records.length>6?h('div',{className:'text-xs px-1',style:{color:'#8B8576'}},'외 '+(parsed.records.length-6)+'건'):null
        )
      ):null,
      h('div',{className:'flex justify-end gap-2 mt-1'},
        h(Btn,{type:'button',onClick:onClose},'취소'),
        h(Btn,{type:'submit',variant:'primary'},parsed?'가져오기 확정':'분석하기')
      )
    )
  );
}

/* ================= Dashboard ================= */
function Dashboard({data,actions}){
  var [memberFilter,setMemberFilter]=useState('');
  var loans=data.loans, members=data.members, reservations=data.reservations, transfers=data.transfers;
  var activeLoans = loans.filter(function(l){return !l.returnDate;});
  var soon = activeLoans.filter(function(l){return loanStatus(l)==='soon';});
  var overdue = activeLoans.filter(function(l){return loanStatus(l)==='overdue';});
  var waitingRes = reservations.filter(function(r){return r.status==='대기중';});
  var readyRes = reservations.filter(function(r){return r.status==='도착';}).slice()

/* ================= App root ================= */
function ensureLibraryList(libraries,name){
  name = (name||'').trim();
  if(!name) return libraries;
  var exists = libraries.some(function(l){return l.toLowerCase()===name.toLowerCase();});
  if(exists) return libraries;
  var next = libraries.concat([name]);
  next.sort(function(a,b){return a.localeCompare(b,'ko');});
  return next;
}

function App(){
  var [user,setUser] = useState(undefined); // undefined = checking, null = logged out, object = logged in
  var [data,setData] = useState(null);
  var [activeTab,setActiveTab] = useState('dashboard');
  var [modal,setModal] = useState(null); // {type, id}
  var [confirmDialog,setConfirmDialog] = useState(null); // {message,onYes}
  var [toast,setToast] = useState('');
  var toastTimer = useRef(null);

  function showToast(msg){
    setToast(msg);
    clearTimeout(toastTimer.current);
    toastTimer.current = setTimeout(function(){ setToast(''); },2400);
  }

  var docPath = user ? ('users/'+user.uid+'/familyLibrary/data') : null;

  useEffect(function(){
    var unsub = firebase.auth().onAuthStateChanged(function(u){ setUser(u); });
    return unsub;
  },[]);

  useEffect(function(){
    if(!user){ setData(null); return; }
    var ref = firebase.firestore().doc('users/'+user.uid+'/familyLibrary/data');
    var unsub = ref.onSnapshot(function(snap){
      if(snap.exists){
        var d = snap.data();
        setData({
          members: d.members||DEFAULT_STATE.members,
          libraries: d.libraries||[],
          loans: d.loans||[],
          reservations: d.reservations||[],
          transfers: d.transfers||[]
        });
      }else{
        ref.set(DEFAULT_STATE).catch(function(e){ showToast('초기 데이터 생성에 실패했어요.'); });
      }
    },function(err){
      console.error(err);
      showToast('데이터를 불러오는 중 문제가 발생했어요.');
    });
    return unsub;
  },[user&&user.uid]);

  function commit(newData){
    setData(newData);
    if(!user) return;
    firebase.firestore().doc('users/'+user.uid+'/familyLibrary/data').set(newData).catch(function(e){
      console.error(e); showToast('저장에 실패했어요. 다시 시도해주세요.');
    });
  }

  /* ---- action handlers ---- */
  var actions = useMemo(function(){
    if(!data) return {};
    function withLoans(fn){ commit(Object.assign({},data,{loans:fn(data.loans.slice())})); }
    function withRes(fn){ commit(Object.assign({},data,{reservations:fn(data.reservations.slice())})); }
    function withTr(fn){ commit(Object.assign({},data,{transfers:fn(data.transfers.slice())})); }
    return {
      showToast: showToast,
      saveLoan: function(rec){
        var libs = ensureLibraryList(data.libraries,rec.library);
        var loans = data.loans.slice();
        var idx = loans.findIndex(function(l){return l.id===rec.id;});
        if(idx>=0) loans[idx]=Object.assign({},loans[idx],rec); else loans.push(rec);
        commit(Object.assign({},data,{libraries:libs,loans:loans}));
        setModal(null); showToast('저장했어요.');
      },
      extendLoan: function(id){
        withLoans(function(loans){
          return loans.map(function(l){ if(l.id!==id) return l;
            var newDue = addDaysStr(l.dueDate,7);
            showToast('반납예정일을 7일 연장했어요 (새 반납예정일 '+fmtDate(newDue)+').');
            return Object.assign({},l,{dueDate:newDue,tag:'반납연기'});
          });
        });
      },
      markReturned: function(id){
        withLoans(function(loans){
          return loans.map(function(l){ return l.id===id?Object.assign({},l,{returnDate:todayStr()}):l; });
        });
        showToast('반납 처리했어요.');
      },
      toggleCategory: function(id){
        withLoans(function(loans){
          return loans.map(function(l){ if(l.id!==id) return l;
            return Object.assign({},l,{category:(l.category==='kids')?'adult':'kids'}); });
        });
      },
      confirmDeleteLoan: function(id){
        setConfirmDialog({message:'이 대출 기록을 삭제할까요?',onYes:function(){
          withLoans(function(loans){ return loans.filter(function(l){return l.id!==id;}); });
          showToast('삭제했어요.'); setConfirmDialog(null);
        }});
      },
      saveReservation: function(rec){
        var libs = ensureLibraryList(data.libraries,rec.library);
        var list = data.reservations.slice();
        var idx = list.findIndex(function(x){return x.id===rec.id;});
        if(idx>=0) list[idx]=Object.assign({},list[idx],rec); else list.push(rec);
        commit(Object.assign({},data,{libraries:libs,reservations:list}));
        setModal(null); showToast('저장했어요.');
      },
      markArrived: function(id){
        withRes(function(list){ return list.map(function(r){return r.id===id?Object.assign({},r,{status:'도착'}):r;}); });
        showToast('도착으로 표시했어요.');
      },
      convertReservation: function(id){
        var r = data.reservations.filter(function(x){return x.id===id;})[0];
        if(!r) return;
        var loans = data.loans.concat([{ id:uid('loan'),title:r.title,author:'',library:r.library,memberId:r.memberId,
          borrowDate:todayStr(),dueDate:addDaysStr(todayStr(),14),returnDate:'',category:inferCategory('') }]);
        var reservations = data.reservations.filter(function(x){return x.id!==id;});
        commit(Object.assign({},data,{loans:loans,reservations:reservations}));
        showToast('대출로 전환했어요.');
      },
      confirmDeleteReservation: function(id){
        setConfirmDialog({message:'이 예약 기록을 삭제할까요?',onYes:function(){
          withRes(function(list){ return list.filter(function(x){return x.id!==id;}); });
          showToast('삭제했어요.'); setConfirmDialog(null);
        }});
      },
      saveTransfer: function(rec){
        var libs = data.libraries.slice();
        if(rec.sourceLibrary) libs = ensureLibraryList(libs,rec.sourceLibrary);
        if(rec.pickupLibrary) libs = ensureLibraryList(libs,rec.pickupLibrary);
        var list = data.transfers.slice();
        var idx = list.findIndex(function(x){return x.id===rec.id;});
        if(idx>=0) list[idx]=Object.assign({},list[idx],rec); else list.push(rec);
        commit(Object.assign({},data,{libraries:libs,transfers:list}));
        setModal(null); showToast('저장했어요.');
      },
      convertTransfer: function(id){
        var t = data.transfers.filter(function(x){return x.id===id;})[0];
        if(!t) return;
        var libs = ensureLibraryList(data.libraries,t.pickupLibrary||t.sourceLibrary||'');
        var loans = data.loans.concat([{ id:uid('loan'),title:t.title,author:'',library:t.pickupLibrary||t.sourceLibrary||'',room:'',
          regno:t.regno||'',memberId:t.memberId,borrowDate:t.arrivalDate||todayStr(),
          dueDate:t.dueDate||addDaysStr(todayStr(),14),returnDate:'',tag:'책나르샤',category:inferCategory('') }]);
        var transfers = data.transfers.filter(function(x){return x.id!==id;});
        commit(Object.assign({},data,{libraries:libs,loans:loans,transfers:transfers}));
        showToast('대출로 전환했어요.');
      },
      confirmDeleteTransfer: function(id){
        setConfirmDialog({message:'이 책나르샤 항목을 삭제할까요?',onYes:function(){
          withTr(function(list){ return list.filter(function(x){return x.id!==id;}); });
          showToast('삭제했어요.'); setConfirmDialog(null);
        }});
      },
      importLoans: function(memberId,records){
        var libs = data.libraries.slice();
        var loans = data.loans.slice();
        var added=0, updated=0;
        records.forEach(function(r){
          libs = ensureLibraryList(libs,r.library);
          var idx = loans.findIndex(function(l){return l.regno===r.regno && l.memberId===memberId && !l.returnDate;});
          if(idx>=0){
            var ex=loans[idx];
            loans[idx]=Object.assign({},ex,{dueDate:r.dueDate,tag:r.tag,room:r.room,title:r.title,library:r.library,
              category: ex.category || inferCategory(r.room)});
            updated++;
          }else{
            loans.push({id:uid('loan'),title:r.title,author:'',library:r.library,room:r.room,regno:r.regno,
              memberId:memberId,borrowDate:r.borrowDate,dueDate:r.dueDate,returnDate:'',tag:r.tag,category:inferCategory(r.room)});
            added++;
          }
        });
        commit(Object.assign({},data,{libraries:libs,loans:loans}));
        setModal(null);
        showToast('새 대출 '+added+'건을 가져왔어요'+(updated>0?', '+updated+'건은 정보를 갱신했어요.':'.'));
      },
      importReservations: function(memberId,records){
        var libs = data.libraries.slice();
        var list = data.reservations.slice();
        var added=0, updated=0;
        records.forEach(function(r){
          libs = ensureLibraryList(libs,r.library);
          var idx = list.findIndex(function(x){return x.memberId===memberId && x.title===r.title && x.status!=='취소';});
          if(idx>=0){
            list[idx]=Object.assign({},list[idx],{status:r.status,library:r.library,pickupDeadline:r.pickupDeadline||''});
            updated++;
          }else{
            list.push({id:uid('res'),title:r.title,library:r.library,memberId:memberId,reserveDate:r.reserveDate,status:r.status,pickupDeadline:r.pickupDeadline||''});
            added++;
          }
        });
        commit(Object.assign({},data,{libraries:libs,reservations:list}));
        setModal(null);
        showToast('새 예약 '+added+'건을 가져왔어요'+(updated>0?', '+updated+'건은 정보를 갱신했어요.':'.'));
      },
      importTransfers: function(memberId,records){
        var libs = data.libraries.slice();
        var loans = data.loans.slice();
        var transfers = data.transfers.slice();
        var IGNORE_STATUSES = ['완료','복귀대상자료(대출불가)'];
        var added=0, updated=0, convertedToLoan=0, ignored=0;
        records.forEach(function(r){
          if(IGNORE_STATUSES.indexOf(r.status)>=0){
            // already resolved (returned) or not borrowable — not useful to track here.
            // if we were already tracking it, drop it; otherwise just skip.
            var before = transfers.length;
            transfers = transfers.filter(function(x){return !(x.regno===r.regno && x.memberId===memberId);});
            if(transfers.length!==before) ignored++;
            return;
          }
          if(r.pickupLibrary) libs = ensureLibraryList(libs,r.pickupLibrary);
          if(r.sourceLibrary) libs = ensureLibraryList(libs,r.sourceLibrary);
          var loanIdx = loans.findIndex(function(l){return l.regno===r.regno && l.memberId===memberId && !l.returnDate;});
          if((r.status||'').indexOf('대출중')===0){
            if(loanIdx>=0){
              loans[loanIdx]=Object.assign({},loans[loanIdx],{dueDate:r.dueDate||loans[loanIdx].dueDate,tag:'책나르샤'});
              updated++;
            }else{
              loans.push({id:uid('loan'),title:r.title,author:'',library:r.pickupLibrary,room:'',regno:r.regno,
                memberId:memberId,borrowDate:r.arrivalDate||todayStr(),dueDate:r.dueDate||addDaysStr(todayStr(),14),
                returnDate:'',tag:'책나르샤',category:inferCategory('')});
              convertedToLoan++;
            }
            transfers = transfers.filter(function(x){return !(x.regno===r.regno && x.memberId===memberId);});
            return;
          }
          var trIdx = transfers.findIndex(function(x){return x.regno===r.regno && x.memberId===memberId;});
          if(trIdx>=0){
            transfers[trIdx]=Object.assign({},transfers[trIdx],{arrivalDate:r.arrivalDate,dueDate:r.dueDate,status:r.status,
              pickupLibrary:r.pickupLibrary,sourceLibrary:r.sourceLibrary});
            updated++;
          }else{
            transfers.push({id:uid('tr'),regno:r.regno,title:r.title,memberId:memberId,requestDate:r.requestDate,
              arrivalDate:r.arrivalDate,dueDate:r.dueDate,pickupLibrary:r.pickupLibrary,sourceLibrary:r.sourceLibrary,status:r.status});
            added++;
          }
        });
        commit(Object.assign({},data,{libraries:libs,loans:loans,transfers:transfers}));
        setModal(null);
        var msg = added+'건을 가져왔어요';
        if(convertedToLoan>0) msg += ', 이미 대출된 '+convertedToLoan+'건은 대출관리로 옮겼어요';
        if(updated>0) msg += ', '+updated+'건은 정보를 갱신했어요';
        if(ignored>0) msg += ', 종료된 '+ignored+'건은 목록에서 정리했어요';
        showToast(msg+'.');
      },
      addMember: function(){
        var color = MEMBER_COLORS[data.members.length % MEMBER_COLORS.length];
        commit(Object.assign({},data,{members:data.members.concat([{id:uid('m'),name:'새 가족원',color:color}])}));
      },
      renameMember: function(id,name){
        commit(Object.assign({},data,{members:data.members.map(function(m){return m.id===id?Object.assign({},m,{name:name}):m;})}));
      },
      recolorMember: function(id,color){
        commit(Object.assign({},data,{members:data.members.map(function(m){return m.id===id?Object.assign({},m,{color:color}):m;})}));
      },
      confirmDeleteMember: function(id){
        setConfirmDialog({message:'이 가족 구성원을 삭제할까요? 기존 대출/예약 기록은 남아있어요.',onYes:function(){
          commit(Object.assign({},data,{members:data.members.filter(function(m){return m.id!==id;})}));
          showToast('삭제했어요.'); setConfirmDialog(null);
        }});
      },
      confirmDeleteLibrary: function(name){
        setConfirmDialog({message:'"'+name+'" 도서관을 목록에서 삭제할까요?',onYes:function(){
          commit(Object.assign({},data,{libraries:data.libraries.filter(function(l){return l!==name;})}));
          showToast('삭제했어요.'); setConfirmDialog(null);
        }});
      },
      confirmRestoreBackup: function(parsed){
        setConfirmDialog({message:'불러온 파일로 현재 데이터를 덮어쓸까요?',onYes:function(){
          commit({
            members: parsed.members||[], libraries: parsed.libraries||[], loans: parsed.loans||[],
            reservations: parsed.reservations||[], transfers: parsed.transfers||[]
          });
          showToast('데이터를 불러왔어요.'); setConfirmDialog(null);
        }});
      }
    };
  },[data,user]);

  function openModal(m){ setModal(m); }
  function closeModal(){ setModal(null); }

  function waitForGSI(cb){
    if(window.google && window.google.accounts && window.google.accounts.id){ cb(); return; }
    var tries = 0;
    var timer = setInterval(function(){
      tries++;
      if(window.google && window.google.accounts && window.google.accounts.id){
        clearInterval(timer); cb();
      }else if(tries>100){
        clearInterval(timer);
        showToast('구글 로그인 스크립트를 불러오지 못했어요. 새로고침해보세요.');
      }
    },100);
  }
  function ensureGSIInitialized(){
    if(window.__gsiInit) return;
    window.__gsiInit = true;
    window.google.accounts.id.initialize({
      client_id: GOOGLE_WEB_CLIENT_ID,
      callback: function(response){
        var credential = firebase.auth.GoogleAuthProvider.credential(response.credential);
        firebase.auth().signInWithCredential(credential).catch(function(e){
          console.error(e); showToast('로그인에 실패했어요. 다시 시도해주세요.');
        });
      }
    });
  }
  function handleGoogleButtonReady(divEl){
    waitForGSI(function(){
      ensureGSIInitialized();
      window.google.accounts.id.renderButton(divEl,{theme:'outline',size:'large',text:'signin_with',shape:'pill'});
    });
  }

  function handleLogout(){
    firebase.auth().signOut();
    if(window.google && window.google.accounts && window.google.accounts.id){
      window.google.accounts.id.disableAutoSelect();
    }
  }

  if(user===undefined){
    return h('div',{className:'min-h-screen flex items-center justify-center',style:{background:'#EDE8DA',color:'#8B8576'}},'불러오는 중...');
  }
  if(user===null){
    return h(LoginScreen,{onGoogleButtonReady:handleGoogleButtonReady});
  }
  if(!data){
    return h('div',{className:'min-h-screen flex items-center justify-center',style:{background:'#EDE8DA',color:'#8B8576'}},'데이터를 불러오는 중...');
  }

  var TABS = [
    {id:'dashboard',label:'대시보드'},{id:'loans',label:'대출관리'},{id:'reservations',label:'예약도서'},
    {id:'transfers',label:'책나르샤'},{id:'history',label:'이력'},{id:'settings',label:'설정'}
  ];

  return h('div',null,
    h('datalist',{id:'libraryOptions'},data.libraries.map(function(l){return h('option',{key:l,value:l});})),
    h('div',{className:'px-4 py-5',style:{background:'#1F3D34',color:'#EDE8DA'}},
      h('div',{className:'max-w-3xl mx-auto flex items-center justify-between gap-3'},
        h('div',{className:'flex items-center gap-3.5'},
          h(Stamp,{color:'#B8874A'},['우리','가족'].map(function(t,i){return h('div',{key:i},t);})),
          h('div',null,
            h('h1',{className:'font-serif text-lg font-bold'},'우리 가족 도서관'),
            h('p',{className:'text-xs mt-0.5',style:{color:'#C9D6CD'}},'대출 · 예약 · 책나르샤를 한 곳에서')
          )
        ),
        h('button',{onClick:function(){setActiveTab('settings');},className:'w-9 h-9 rounded-full border flex items-center justify-center flex-shrink-0',
          style:{borderColor:'#3C5A50'}},'⚙')
      )
    ),
    h('div',{className:'max-w-3xl mx-auto px-4 flex gap-1.5 pt-3.5 overflow-x-auto'},
      TABS.map(function(t){
        var active = activeTab===t.id;
        return h('button',{key:t.id,onClick:function(){setActiveTab(t.id);},
          className:'text-sm font-medium px-4 py-2 rounded-full border whitespace-nowrap flex-shrink-0',
          style: active?{background:'#1F3D34',color:'#EDE8DA',borderColor:'#1F3D34'}:{background:'#FFFEFA',borderColor:'#DAD2BC',color:'#26241D'}
        },t.label);
      })
    ),
    h('div',{className:'max-w-3xl mx-auto px-4 pt-5 pb-20'},
      activeTab==='dashboard'?h(Dashboard,{data:data,actions:actions}):null,
      activeTab==='loans'?h(LoansTab,{data:data,actions:actions,openModal:openModal}):null,
      activeTab==='history'?h(HistoryTab,{data:data,actions:actions,openModal:openModal}):null,
      activeTab==='reservations'?h(ReservationsTab,{data:data,actions:actions,openModal:openModal}):null,
      activeTab==='transfers'?h(TransfersTab,{data:data,actions:actions,openModal:openModal}):null,
      activeTab==='settings'?h(SettingsTab,{data:data,actions:actions,user:user,onLogout:handleLogout}):null
    ),
    modal&&modal.type==='loan'?h(LoanForm,{rec:modal.id?data.loans.filter(function(l){return l.id===modal.id;})[0]:null,
      members:data.members,onSave:actions.saveLoan,onClose:closeModal}):null,
    modal&&modal.type==='reservation'?h(ReservationForm,{rec:modal.id?data.reservations.filter(function(r){return r.id===modal.id;})[0]:null,
      members:data.members,onSave:actions.saveReservation,onClose:closeModal}):null,
    modal&&modal.type==='transfer'?h(TransferForm,{rec:modal.id?data.transfers.filter(function(t){return t.id===modal.id;})[0]:null,
      members:data.members,onSave:actions.saveTransfer,onClose:closeModal}):null,
    modal&&modal.type==='import-loan'?h(ImportModal,{kind:'loan',members:data.members,onClose:closeModal,onConfirm:actions.importLoans}):null,
    modal&&modal.type==='import-reservation'?h(ImportModal,{kind:'reservation',members:data.members,onClose:closeModal,onConfirm:actions.importReservations}):null,
    modal&&modal.type==='import-transfer'?h(ImportModal,{kind:'transfer',members:data.members,onClose:closeModal,onConfirm:actions.importTransfers}):null,
    h(ConfirmDialog,{dialog:confirmDialog,onCancel:function(){setConfirmDialog(null);},
      onConfirm:function(){ if(confirmDialog&&confirmDialog.onYes) confirmDialog.onYes(); }}),
    h(Toast,{message:toast})
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>
</body>
</html>
